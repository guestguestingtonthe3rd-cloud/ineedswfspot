<!DOCTYPE html>
<html>
<head>
    <style>
        /* Force explicit structural sizing instead of relying on viewport percentages */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #1a1a1a; 
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }
        #player-container { 
            flex: 1;
            width: 100%;
            background: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        /* Crucial fix: ensure the internal canvas generated by Ruffle scales correctly */
        #player-container ruffle-player {
            width: 100%;
            height: 100%;
        }
        #controls { 
            height: 50px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            background: #2b2b2b; 
            border-top: 1px solid #3d3d3d;
        }
        button, .file-label { 
            padding: 6px 14px; 
            font-size: 13px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        #browse-label { background-color: #f0f0f0; color: #333; }
        #browse-label:hover { background-color: #dbdbdb; }
        #pause-btn { background-color: #4CAF50; }
        #pause-btn:hover { background-color: #45a049; }
        #fullscreen-btn { background-color: #008CBA; }
        #fullscreen-btn:hover { background-color: #007B9A; }
        #file-input { display: none; }
    </style>
    <!-- Load the reliable official Ruffle CDN library -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="wrapper">
        <!-- Flash Viewport -->
        <div id="player-container"></div>

        <!-- System Controls -->
        <div id="controls">
            <label id="browse-label" class="file-label" for="file-input">Browse SWF File</label>
            <input type="file" id="file-input" accept=".swf">
            <button id="pause-btn">Pause</button>
            <button id="fullscreen-btn">Fullscreen</button>
        </div>
    </div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        let ruffleInstance = null;
        let player = null;
        let isPaused = false;

        window.addEventListener("DOMContentLoaded", () => {
            ruffleInstance = window.RufflePlayer.newest();
            player = ruffleInstance.createPlayer();
            document.getElementById("player-container").appendChild(player);

            const fileInput = document.getElementById("file-input");
            const pauseBtn = document.getElementById("pause-btn");
            const fullscreenBtn = document.getElementById("fullscreen-btn");

            // File Loading Process 
            fileInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    // Convert file array buffer into standard binary format array
                    const arr = new Uint8Array(event.target.result);
                    
                    // Instruct Ruffle to process the data natively without web URL calls
                    player.load({ data: arr });
                    
                    // Reset operational triggers
                    isPaused = false;
                    pauseBtn.textContent = "Pause";
                    pauseBtn.style.backgroundColor = "#4CAF50";
                };
                reader.readAsArrayBuffer(file);
            });

            // Playback Management
            pauseBtn.addEventListener("click", () => {
                if (!player) return;
                if (!isPaused) {
                    player.pause();
                    pauseBtn.textContent = "Play";
                    pauseBtn.style.backgroundColor = "#ff9800";
                    isPaused = true;
                } else {
                    player.play();
                    pauseBtn.textContent = "Pause";
                    pauseBtn.style.backgroundColor = "#4CAF50";
                    isPaused = false;
                }
            });

            // Window Scale Management
            fullscreenBtn.addEventListener("click", () => {
                if (!player) return;
                if (player.requestFullscreen) player.requestFullscreen();
                else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
                else if (player.msRequestFullscreen) player.msRequestFullscreen();
            });
        });
    </script>

</body>
</html>
